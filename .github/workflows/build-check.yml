name: build-check

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: lint · YAML · workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff yamllint

      - name: Lint backend (ruff)
        run: ruff check backend tests scripts

      - name: Lint workflows YAML
        run: |
          yamllint -d '{extends: default, rules: {line-length: disable, document-start: disable, truthy: {check-keys: false}, comments: {min-spaces-from-content: 1}}}' .github/workflows

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend lint (expo lint)
        working-directory: frontend
        run: |
          yarn install --network-timeout 600000
          yarn lint || true   # report only; frontend-tests.yml is the gate

      - name: Verify release artifacts
        run: |
          test -f VERSION || (echo 'VERSION missing' && exit 1)
          test -f CHANGELOG.md || (echo 'CHANGELOG.md missing' && exit 1)
          version=$(cat VERSION | tr -d ' \n')
          echo "VERSION=$version"
          grep -q "^## $version" CHANGELOG.md || (echo 'CHANGELOG missing entry for current VERSION' && exit 1)
          test -f docs/UAT_RESULTS.md || (echo 'docs/UAT_RESULTS.md missing' && exit 1)
          test -f docs/DEPLOYMENT_CHECKLIST.md || (echo 'docs/DEPLOYMENT_CHECKLIST.md missing' && exit 1)
          test -f docs/ROLLBACK_PLAN.md || (echo 'docs/ROLLBACK_PLAN.md missing' && exit 1)
          test -f docs/LAUNCH_NOTES.md || (echo 'docs/LAUNCH_NOTES.md missing' && exit 1)
          test -f docs/PRODUCTION_ENV_CHECKLIST.md || (echo 'docs/PRODUCTION_ENV_CHECKLIST.md missing' && exit 1)
          test -f docs/PWA_MOBILE_CHECKLIST.md || (echo 'docs/PWA_MOBILE_CHECKLIST.md missing' && exit 1)
          echo 'Release artifacts present.'

name: backend-tests

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - 'tests/unit/**'
      - 'tests/api/**'
      - 'tests/conftest.py'
      - 'tests/pytest.ini'
      - 'scripts/seed_test_users.py'
      - 'scripts/build_qa_status.py'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (unit + api)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})' || mongo --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Backend runtime
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: ruleforge_ci
      JWT_SECRET: ci-secret-do-not-use-in-prod
      ADMIN_EMAIL: admin@ruleforge.app
      ADMIN_PASSWORD: Admin@1234
      FRONTEND_URL: http://localhost:3000
      BCRYPT_ROUNDS: '4'
      BCRYPT_THREAD_POOL_SIZE: '8'
      # Test client
      TEST_BACKEND_URL: http://localhost:8001
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if nc -z localhost 27017; then echo "mongo up"; exit 0; fi
            sleep 1
          done
          echo "mongo did not start"; exit 1

      - name: Seed deterministic test users
        run: python scripts/seed_test_users.py

      - name: Start FastAPI backend
        working-directory: backend
        run: |
          nohup python -m uvicorn server:app --host 0.0.0.0 --port 8001 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in {1..40}; do
            if curl -fsS http://localhost:8001/api/rules > /dev/null; then echo "backend up"; exit 0; fi
            sleep 1
          done
          echo "backend did not start"; tail -200 /tmp/backend.log; exit 1

      - name: Run pytest (unit + api)
        run: |
          mkdir -p test_reports
          python scripts/build_qa_status.py

      - name: Upload pytest summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-summary
          path: test_reports/pytest_summary.json
          if-no-files-found: warn

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/backend.log
          if-no-files-found: ignore

      - name: Stop backend
        if: always()
        run: |
          kill $(cat /tmp/backend.pid) 2>/dev/null || true

      - name: Fail if any pytest failures
        run: |
          python - <<'PY'
          import json, sys
          with open('test_reports/pytest_summary.json') as f:
              s = json.load(f)
          print(f"passed={s.get('passed')} failed={s.get('failed')} errors={s.get('errors')} returncode={s.get('returncode')}")
          if s.get('failed', 0) or s.get('errors', 0) or s.get('returncode', 0) != 0:
              sys.exit(1)
          PY
